[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
lib_deps = 
	miguelbalboa/MFRC522@^1.4.12
	madhephaestus/ESP32Servo@^3.1.3
	marcoschwartz/LiquidCrystal_I2C@^1.1.4
	electric-sheep-co/Redis for Arduino@^2.6.3
